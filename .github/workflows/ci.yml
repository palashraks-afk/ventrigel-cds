name: tests

# The analysis is only trustworthy if the validation checks run. They are part
# of the test suite, so a transcription error or a regression in the power
# mathematics fails CI rather than silently changing a published number.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest test_ventrigel.py -q

      - name: Reproduce the full analysis
        run: python run_analysis.py

      - name: Regenerate every figure
        run: python make_figures.py

      - name: Check the manuscript's numbers against the analysis output
        run: python check_manuscript.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/
